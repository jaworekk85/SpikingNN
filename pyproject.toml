[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snn-research"
version = "0.0.1"
description = "Research framework for spiking neural networks and local learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pyyaml>=6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["snn_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
