name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q src
      - name: Install package with CPU PyTorch
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[dev]"
      - name: Run tests
        run: python -m pytest -q
