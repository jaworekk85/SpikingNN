# MNIST reference (6k train / 1k test subsample, CPU, ~1 min per seed for all rules).
# Downloads MNIST once into data/ (MD5-checked). Pipeline validation, not a result.
# Only non-default values are listed; every run saves the full resolved config.
experiment: reference_mnist
seeds: [0, 1, 2]
dataset: mnist
mnist: {n_train: 6000, n_test: 1000}
model: {hidden: [128], init_gain: 5.0}
three_factor: {lr: 0.1, readout_lr: 0.5}  # hand-picked 2026-10-13 (on test; superseded by tune.py)
stdp: {a_plus: 0.0001, a_minus: 0.00015}  # depression must dominate on 784 inputs
stream: {q_target: 0.7}
tuning:  # tune.py: search on a tune split carved from training data; never on test
  grids:  # similar budgets: 5 / 9 / 8 candidates, tuning seeds 100 and 101
    surrogate_bptt: {surrogate_bptt.lr: [0.001, 0.003, 0.01, 0.03, 0.1]}
    three_factor: {three_factor.lr: [0.03, 0.1, 0.3], three_factor.readout_lr: [0.25, 0.5, 1.0]}
    stdp: {stdp.a_plus: [0.00003, 0.0001], stdp.a_minus: [0.00015, 0.0003], three_factor.readout_lr: [0.5, 1.0]}
