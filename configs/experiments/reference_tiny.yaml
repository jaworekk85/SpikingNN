# Tiny CPU pipeline check on synthetic data. Pipeline validation, not a result.
experiment: reference_tiny
seeds: [0, 1]
device: cpu
data:
  n_train: 256
  n_test: 128
  n_classes: 4
  shape: [16]
  noise: 0.15
  seed: 0
encoding:
  kind: rate
  T: 20
neuron:
  tau_mem_ms: 10.0
  dt_ms: 1.0
  threshold: 1.0
  reset: subtract
  refractory_steps: 0
  surrogate_slope: 10.0
model:
  kind: mlp
  hidden: [32]
  init_gain: 5.0  # default init leaves hidden LIF layers almost silent
rule: surrogate_bptt  # or three_factor, stdp (STDP hidden + three-factor readout)
surrogate_bptt:
  lr: 0.01
three_factor:
  lr: 1.0
  readout_lr: 5.0
  tau_pre_ms: 10.0
  tau_eligibility_ms: 20.0
  pseudo_slope: 5.0
  train_hidden: true
stdp:
  a_plus: 0.001
  a_minus: 0.00105
  tau_plus_ms: 10.0
  tau_minus_ms: 10.0
  w_max: 1.0
protocol:
  epochs: 5
  batch_size: 32
