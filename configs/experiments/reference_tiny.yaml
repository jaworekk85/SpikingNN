# Tiny CPU pipeline check on synthetic data (seconds). Pipeline validation, not a result.
# Only non-default values are listed; every run saves the full resolved config.
experiment: reference_tiny
seeds: [0, 1]
model:
  init_gain: 5.0  # default init leaves hidden LIF layers almost silent
# Defaults otherwise: 16-dim synthetic prototypes (4 classes), rate coding T=20, LIF
# tau 10 ms / dt 1 ms, MLP 32 hidden, abrupt noise shift (0.3) at samples 256-511 of 768,
# energy proxy 0.9 pJ/synop and 4.6 pJ/MAC. Rule: --rule surrogate_bptt | three_factor | stdp | all.
tuning:  # tiny grids for the smoke test; tuning uses a tune split, never test
  seeds: [100]
  grids:
    surrogate_bptt: {surrogate_bptt.lr: [0.003, 0.01]}
    three_factor: {three_factor.lr: [0.3, 1.0]}
    stdp: {stdp.a_plus: [0.0003, 0.001]}
