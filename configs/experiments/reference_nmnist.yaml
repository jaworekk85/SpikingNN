# N-MNIST reference (event-camera MNIST; 6k train / 1k test, CPU, ~10 min for 3 rules x 3 seeds).
# Downloads ~1.2 GB once into data/nmnist (MD5-checked) and caches binned frames.
# Only non-default values are listed; every run saves the full resolved config.
experiment: reference_nmnist
seeds: [0, 1, 2]
dataset: nmnist  # defaults: 300 ms (all saccades) in T=30 bins of 10 ms
encoding: {kind: events, T: 30}  # binned events pass through; T must equal nmnist.T
neuron: {tau_mem_ms: 20.0, dt_ms: 10.0}  # dt must equal the bin width
model: {hidden: [128], init_gain: 5.0}
three_factor: {lr: 0.1, readout_lr: 0.5}  # hand-picked 2026-10-13 (on test; superseded by tune.py)
stdp: {a_plus: 0.0001, a_minus: 0.00015}
stream: {q_target: 0.7}
shift: {kind: intensity, magnitude: 0.5}  # event rate halves; latency_jitter is the temporal alternative
tuning:
  grids:
    surrogate_bptt: {surrogate_bptt.lr: [0.001, 0.003, 0.01, 0.03, 0.1]}
    three_factor: {three_factor.lr: [0.03, 0.1, 0.3], three_factor.readout_lr: [0.25, 0.5, 1.0]}
    stdp: {stdp.a_plus: [0.00003, 0.0001], stdp.a_minus: [0.00015, 0.0003], three_factor.readout_lr: [0.5, 1.0]}
